name: Continuous Deployment to VPS

# Cả repo BE và FE đều gọi cùng một script: /var/www/stockpilot/backend/deploy.sh.
# Script đó tự đọc khóa bí mật từ backend/.env (docker compose --env-file), nên không có
# mật khẩu nào đi qua GitHub Actions hay xuất hiện trong log.
#
# GitHub Secrets cần có:
#   VPS_HOST, VPS_SSH_KEY            bắt buộc
#   VPS_USERNAME (mặc định root), VPS_PORT (mặc định 22), VPS_PROJECT_DIR (mặc định /var/www/stockpilot)
#   VPS_KNOWN_HOSTS                  public host key đã xác minh; cổng 22 dùng dạng `<host> ssh-ed25519 ...`
#   VPS_PASSWORD                     chỉ dùng khi chưa có VPS_SSH_KEY (không khuyến khích)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Auto Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger remote deployment over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME || 'root' }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          TARGET_DIR: ${{ secrets.VPS_PROJECT_DIR || '/var/www/stockpilot' }}
        run: |
          set -euo pipefail
          echo "🚀 [GitHub Actions] Triển khai lên VPS..."

          if [ -z "$VPS_HOST" ]; then
            echo "❌ Thiếu secret VPS_HOST."
            exit 1
          fi

          SSH_DIR="$RUNNER_TEMP/ssh"
          umask 077
          mkdir -p "$SSH_DIR"
          trap 'rm -rf "$SSH_DIR"' EXIT

          SSH_OPTS=(-p "$VPS_PORT" -o BatchMode=yes -o ServerAliveInterval=30 -o UserKnownHostsFile="$SSH_DIR/known_hosts")
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            # OpenSSH uses `host` for the default port 22 and `[host]:port` only for non-default ports.
            # Accept the previously saved `[host]:22` form, but normalize it before strict checking.
            NORMALIZED_KNOWN_HOSTS=$(printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r')
            if [ "$VPS_PORT" = "22" ]; then
              NORMALIZED_KNOWN_HOSTS=$(printf '%s\n' "$NORMALIZED_KNOWN_HOSTS" | sed -E 's/^\[([^]]+)\]:22 /\1 /')
              KNOWN_HOST_QUERY="$VPS_HOST"
            else
              KNOWN_HOST_QUERY="[$VPS_HOST]:$VPS_PORT"
            fi
            printf '%s\n' "$NORMALIZED_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
            if ! ssh-keygen -F "$KNOWN_HOST_QUERY" -f "$SSH_DIR/known_hosts" >/dev/null; then
              echo "❌ VPS_KNOWN_HOSTS không chứa host key cho $KNOWN_HOST_QUERY."
              exit 1
            fi
            SSH_OPTS+=(-o StrictHostKeyChecking=yes)
          else
            echo "⚠️ Chưa có secret VPS_KNOWN_HOSTS: chấp nhận host key lần đầu (kém an toàn hơn)."
            SSH_OPTS+=(-o StrictHostKeyChecking=accept-new)
          fi

          # Luôn chạy backend/deploy.sh mới nhất (không dùng bản deploy.sh cũ ở thư mục gốc VPS).
          Q_DIR=$(printf '%q' "$TARGET_DIR")
          REMOTE_CMD="set -e
            cd $Q_DIR
            if [ ! -f backend/deploy.sh ]; then echo '❌ Không thấy backend/deploy.sh trong '$Q_DIR; exit 1; fi
            git -C backend fetch --quiet origin main
            git -C backend reset --hard --quiet origin/main
            bash backend/deploy.sh"

          if [ -n "$VPS_SSH_KEY" ]; then
            echo "🔑 Xác thực bằng SSH key."
            printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$SSH_DIR/id_deploy"
            ssh "${SSH_OPTS[@]}" -o IdentitiesOnly=yes -i "$SSH_DIR/id_deploy" "$VPS_USERNAME@$VPS_HOST" "$REMOTE_CMD"
          elif [ -n "$VPS_PASSWORD" ]; then
            echo "⚠️ Đang xác thực bằng mật khẩu. Nên chuyển sang VPS_SSH_KEY."
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            export SSHPASS="$VPS_PASSWORD"
            SSH_OPTS=("${SSH_OPTS[@]/BatchMode=yes/BatchMode=no}")
            sshpass -e ssh "${SSH_OPTS[@]}" "$VPS_USERNAME@$VPS_HOST" "$REMOTE_CMD"
          else
            echo "❌ Cần cấu hình VPS_SSH_KEY (hoặc VPS_PASSWORD) trong GitHub Secrets."
            exit 1
          fi
